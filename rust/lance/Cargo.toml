[package]
name = "lance"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
readme = "README.md"
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
autobins = false
autobenches = false
autoexamples = false
autotests = false

[package.metadata.docs.rs]
# Publish the feature-gated metrics catalogue; keep cloud backends off.
features = ["metrics"]
no-default-features = true

[package.metadata.cargo-machete]
ignored = ["tracing-chrome"]

[dependencies]
arc-swap = { workspace = true }
lance-arrow = { workspace = true }
lance-core = { workspace = true }
lance-datafusion = { workspace = true }
lance-encoding = { workspace = true }
lance-file = { workspace = true }
lance-io = { workspace = true }
lance-linalg = { workspace = true }
lance-index = { workspace = true }
lance-select = { workspace = true }
lance-tokenizer = { workspace = true }
lance-table = { workspace = true }
lance-table-runtime = { workspace = true }
lance-bitpacking = { workspace = true }
blake3 = { workspace = true }
arrow-arith = { workspace = true }
arrow-array = { workspace = true }
arrow-buffer = { workspace = true }
arrow-cast = { workspace = true }
arrow-ipc = { workspace = true }
arrow-ord = { workspace = true }
arrow-row = { workspace = true }
arrow-schema = { workspace = true }
arrow-select = { workspace = true }
async-recursion.workspace = true
async-trait.workspace = true
byteorder.workspace = true
bytes.workspace = true
chrono.workspace = true
clap = { workspace = true, optional = true }
# Only used by the (disabled) `mem_wal_kv_point_lookup` benchmark's RocksDB arm.
# Commented out so CI's all-features build never compiles the bundled librocksdb
# C++ sources (needs libclang). Uncomment with the bench target + feature to run.
# rocksdb = { version = "0.23", optional = true, default-features = false }
crossbeam-queue = { workspace = true }
crossbeam-skiplist.workspace = true
# This is already used by datafusion
dashmap.workspace = true
# Fast non-cryptographic hasher for the hot FTS mem-index insert path.
rustc-hash = "2.1"
# Compact FST term dictionary for the FTS mem-index partitions.
fst.workspace = true
itertools.workspace = true
moka.workspace = true
num-traits.workspace = true
object_store = { workspace = true }
pin-project.workspace = true
prost.workspace = true
prost-types.workspace = true
roaring.workspace = true
hex.workspace = true
tokio.workspace = true
url.workspace = true
rand.workspace = true
rayon.workspace = true
futures.workspace = true
uuid.workspace = true
arrow.workspace = true
datafusion-common.workspace = true
datafusion-common-runtime.workspace = true
datafusion-execution.workspace = true
datafusion-session.workspace = true
datafusion-catalog.workspace = true
datafusion-datasource.workspace = true
datafusion-functions-nested.workspace = true
datafusion-optimizer.workspace = true
datafusion-sql.workspace = true
datafusion-functions.workspace = true
datafusion-functions-aggregate.workspace = true
datafusion-physical-expr.workspace = true
datafusion-physical-optimizer.workspace = true
datafusion-physical-plan.workspace = true
datafusion-expr.workspace = true
either.workspace = true
snafu = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
permutation = { version = "0.4.0" }
aws-sdk-dynamodb = { workspace = true, optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
tracing.workspace = true
humantime = { workspace = true }
async_cell = "0.2.2"
semver.workspace = true
tokio-stream = { workspace = true }
tokio-util = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
pprof.workspace = true
# Need this so we can prevent dynamic linking in binaries (see cli feature)
lzma-sys = { version = "0.1" }

[dev-dependencies]
metrics.workspace = true
metrics-util.workspace = true
lance-test-macros = { workspace = true }
pretty_assertions = { workspace = true }
libc = { workspace = true }
clap = { workspace = true, features = ["derive"] }
criterion = { workspace = true }
approx.workspace = true
all_asserts.workspace = true
mock_instant.workspace = true
lance-testing = { workspace = true, features = ["datafusion"] }
lance-io = { workspace = true, features = ["test-util"] }
lance-table-runtime = { workspace = true, features = ["test-util"] }
lance-index = { workspace = true, features = ["test-oracle"] }
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
tracing-mock.workspace = true
env_logger.workspace = true
tempfile.workspace = true
test-log.workspace = true
sha2.workspace = true
tracing-chrome = "0.7.1"
rstest = { workspace = true }
serial_test = { workspace = true }
tracking-allocator = { version = "0.4", features = ["tracing-compat"] }
half.workspace = true
geo-types = { workspace = true }
parquet = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
wiremock.workspace = true

[[test]]
name = "readonly_baseline"

[[test]]
name = "arrow_ordering"

[features]
default = ["aws", "azure", "gcp", "oss", "huggingface", "tencent", "tos", "goosefs"]
backtrace = ["lance-core/backtrace"]
fp16kernels = ["lance-linalg/fp16kernels"]
# Prevent dynamic linking of lzma, which comes from datafusion
cli = ["dep:clap", "lzma-sys/static"]
dynamodb = ["lance-table-runtime/dynamodb", "dep:aws-sdk-dynamodb"]
dynamodb_tests = ["dynamodb"]
protoc = []
aws = ["lance-io/aws", "lance-table-runtime/aws"]
gcp = ["lance-io/gcp", "lance-table-runtime/gcp"]
azure = ["lance-io/azure", "lance-table-runtime/azure"]
oss = ["lance-io/oss", "lance-table-runtime/oss"]
tencent = ["lance-io/tencent", "lance-table-runtime/tencent"]
goosefs = ["lance-io/goosefs", "lance-table-runtime/goosefs"]
tos = ["lance-io/tos", "lance-table-runtime/tos"]
huggingface = ["lance-io/huggingface", "lance-table-runtime/huggingface"]
# Publish object store and memory metrics via the `metrics` crate.
metrics = ["lance-core/metrics", "lance-io/metrics"]
# Enable slow integration tests (disabled by default in CI)
slow_tests = []
# Expose internal update-join controls to the dedicated benchmark target.
update-join-bench = []
# Compile the RocksDB comparison arm of the (disabled) mem_wal_kv_point_lookup
# bench. Commented out so it stays out of CI's all-features build.
# bench-rocksdb = ["dep:rocksdb"]

[lints]
workspace = true
